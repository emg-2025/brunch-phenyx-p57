<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contrôle entrée — Brunch Phénix 57</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Work+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --forest:#122217; --gold:#eea93b; --gold-deep:#c97f1f;
    --cream:#fbf5e8; --ok:#3fb56b; --bad:#e0453a; --warn:#e0a53a;
    --line:rgba(238,169,59,0.25);
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh; background:var(--forest); color:var(--cream);
    font-family:'Work Sans',sans-serif;
    display:flex; flex-direction:column; align-items:center;
    padding:24px 16px 48px;
  }
  h1{
    font-family:'Anton',sans-serif; font-weight:400; font-size:26px;
    color:var(--gold); margin:8px 0 2px; text-align:center;
  }
  p.sub{color:rgba(251,245,232,0.6); font-size:13px; margin:0 0 20px; text-align:center;}
  #reader{
    width:100%; max-width:420px; border-radius:14px; overflow:hidden;
    border:1px solid var(--line); box-shadow:0 18px 40px rgba(0,0,0,0.4);
  }
  .result{
    width:100%; max-width:420px; margin-top:20px; padding:20px;
    border-radius:12px; text-align:center; font-weight:700; font-size:16px;
    display:none; flex-direction:column; gap:6px;
  }
  .result.show{display:flex;}
  .result.ok{background:rgba(63,181,107,0.15); border:1px solid var(--ok); color:#a9e6bc;}
  .result.bad{background:rgba(224,69,58,0.15); border:1px solid var(--bad); color:#f3b1ac;}
  .result.warn{background:rgba(224,165,58,0.15); border:1px solid var(--warn); color:#f2d69a;}
  .result .sub{font-weight:500; font-size:13px; opacity:0.85;}
  .stat{
    display:flex; gap:14px; margin-top:22px; font-size:13px;
    color:rgba(251,245,232,0.55);
  }
  .stat b{color:var(--cream); font-family:monospace;}
  #manualBox{
    margin-top:18px; width:100%; max-width:420px; display:flex; gap:8px;
  }
  #manualInput{
    flex:1; padding:10px 12px; border-radius:8px; border:1px solid rgba(251,245,232,0.2);
    background:rgba(255,255,255,0.04); color:var(--cream); font-size:13px;
  }
  #manualBtn{
    padding:10px 16px; border-radius:8px; border:none; font-weight:700;
    background:linear-gradient(90deg,var(--gold-deep),var(--gold)); color:#1a1206; cursor:pointer;
  }
</style>
</head>
<body>
  <h1>Contrôle d'entrée — Brunch Phénix 57</h1>
  <p class="sub">Scannez le QR du ticket. Chaque ticket ne peut être validé qu'une seule fois.</p>

  <div id="reader"></div>

  <div id="manualBox">
    <input id="manualInput" placeholder="Ou collez le contenu du QR manuellement">
    <button id="manualBtn">Vérifier</button>
  </div>

  <div class="result" id="result">
    <div id="resultTitle"></div>
    <div class="sub" id="resultSub"></div>
  </div>

  <div class="stat">
    <span>Validés cette session : <b id="okCount">0</b></span>
    <span>Refusés : <b id="badCount">0</b></span>
  </div>

<script>
let okCount = 0, badCount = 0;
let busy = false; // évite de traiter le même scan plusieurs fois de suite

async function verifyRaw(raw){
  if(busy) return;
  busy = true;
  const box = document.getElementById('result');
  const title = document.getElementById('resultTitle');
  const sub = document.getElementById('resultSub');

  try{
    const res = await fetch('/.netlify/functions/verify-ticket', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ raw })
    });
    const data = await res.json();

    box.className = 'result show';
    if(data.status === 'ok'){
      box.classList.add('ok');
      title.textContent = `✅ ${data.ticketNo} — ${data.nom}`;
      sub.textContent = data.message;
      okCount++;
    } else if(data.status === 'already_used'){
      box.classList.add('warn');
      title.textContent = `⚠️ ${data.ticketNo || ''} déjà utilisé`;
      sub.textContent = data.message;
      badCount++;
    } else {
      box.classList.add('bad');
      title.textContent = "❌ Ticket refusé";
      sub.textContent = data.message || "Ticket invalide.";
      badCount++;
    }
    document.getElementById('okCount').textContent = okCount;
    document.getElementById('badCount').textContent = badCount;
  }catch(err){
    box.className = 'result show bad';
    title.textContent = "❌ Erreur réseau";
    sub.textContent = "Impossible de contacter le serveur de vérification.";
  }finally{
    // Petit délai avant de pouvoir scanner le suivant, le temps que l'agent lise le résultat
    setTimeout(() => { busy = false; }, 1800);
  }
}

const scanner = new Html5Qrcode("reader");
Html5Qrcode.getCameras().then(cameras => {
  if(cameras && cameras.length){
    const camId = cameras.length > 1 ? cameras[cameras.length - 1].id : cameras[0].id; // souvent la caméra arrière
    scanner.start(
      camId,
      { fps: 10, qrbox: 240 },
      (decodedText) => verifyRaw(decodedText)
    );
  }
}).catch(() => {
  document.getElementById('reader').innerHTML =
    '<p style="padding:20px;color:#f3b1ac;">Impossible d\'accéder à la caméra. Utilisez la vérification manuelle ci-dessous.</p>';
});

document.getElementById('manualBtn').addEventListener('click', () => {
  const val = document.getElementById('manualInput').value.trim();
  if(val) verifyRaw(val);
});
</script>
</body>
</html>
