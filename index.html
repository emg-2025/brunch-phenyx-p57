<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Paiya de la Gloire 4 — Billetterie EMG</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#120d0a; --panel:#1c150f; --gold:#eea93b; --gold-deep:#c97f1f;
    --cream:#fbf5e8; --line:rgba(238,169,59,0.25);
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--cream);
    font-family:'Poppins',sans-serif;
    min-height:100vh;
  }
  .wrap{ max-width:1180px; margin:0 auto; padding:28px 24px 60px; }
  header{ text-align:center; margin-bottom:28px; }
  header h1{
    font-size:26px; margin:0 0 6px; color:var(--gold); font-weight:800;
  }
  header p{ margin:0; color:rgba(251,245,232,0.6); font-size:14px; }
  .grid{ display:grid; grid-template-columns:1fr 1fr; gap:32px; align-items:start; }
  @media (max-width:880px){ .grid{grid-template-columns:1fr;} .wrap{padding:24px 18px 48px;} }

  .card{
    background:var(--panel); border:1px solid var(--line); border-radius:16px;
    padding:24px;
  }
  label{ display:block; font-size:13px; font-weight:600; color:var(--gold); margin:16px 0 6px; }
  label:first-child{ margin-top:0; }
  input[type=text], input[type=tel]{
    width:100%; padding:12px 14px; border-radius:10px; border:1px solid rgba(251,245,232,0.15);
    background:rgba(255,255,255,0.04); color:var(--cream); font-size:15px; font-family:inherit;
  }
  .type-options{ display:flex; gap:10px; flex-wrap:wrap; }
  .type-option{
    flex:1; min-width:140px; border:2px solid rgba(251,245,232,0.15); border-radius:12px;
    padding:14px; cursor:pointer; transition:border-color .15s, background .15s;
  }
  .type-option.selected{ border-color:var(--gold); background:rgba(238,169,59,0.08); }
  .type-option input{ display:none; }
  .type-option .t-name{ font-weight:700; font-size:15px; }
  .type-option .t-price{ font-weight:800; font-size:22px; color:var(--gold); margin-top:4px; }

  button[type=submit]{
    margin-top:22px; width:100%; padding:14px; border:none; border-radius:12px;
    background:linear-gradient(90deg,var(--gold-deep),var(--gold)); color:#1a1206;
    font-weight:800; font-size:16px; cursor:pointer; font-family:inherit;
  }
  button[type=submit]:disabled{ opacity:0.6; }
  .err{ color:#f3b1ac; font-size:13px; min-height:18px; margin-top:8px; }

  .ticket-panel{ display:flex; flex-direction:column; align-items:center; gap:16px; }
  #emptyState{ color:rgba(251,245,232,0.35); text-align:center; padding:60px 20px; font-size:14px; }
  #ticketCanvas{ width:100%; max-width:520px; border-radius:10px; box-shadow:0 18px 40px rgba(0,0,0,0.4); }
  .actions{ display:flex; flex-wrap:wrap; gap:10px; width:100%; max-width:520px; }
  .actions button{
    flex:1; min-width:140px; padding:12px; border-radius:10px; border:1px solid var(--gold);
    background:transparent; color:var(--gold); font-weight:700; font-size:14px; cursor:pointer; font-family:inherit;
  }
  .btn-whatsapp{ background:#1f7a3f; color:var(--cream); border-color:#1f7a3f; }
  .status{ font-size:13px; min-height:18px; color:rgba(251,245,232,0.6); }
  .status.ok{ color:#8fd19e; }

  .rail-card{ margin-top:24px; }
  .rail-card h3{ font-size:14px; color:var(--gold); margin:0 0 12px; }
  table{ width:100%; border-collapse:collapse; font-size:13px; }
  th{ text-align:left; color:rgba(251,245,232,0.5); font-weight:600; padding:6px 8px; border-bottom:1px solid var(--line); }
  td{ padding:8px; border-bottom:1px solid rgba(251,245,232,0.06); }
  .type-tag{ font-size:11px; padding:2px 8px; border-radius:999px; font-weight:700; }
  .type-tag.emg{ background:rgba(94,166,255,0.15); color:#8fbfff; }
  .type-tag.hors{ background:rgba(238,169,59,0.15); color:var(--gold); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>PAIYA DE LA GLOIRE 4</h1>
    <p>Excellence Médicale Groupe — Sam 12 Sept, à partir de 16H, VRIDI</p>
  </header>

  <div class="grid">
    <div class="card">
      <form id="regForm">
        <label for="nom">Nom complet</label>
        <input type="text" id="nom" placeholder="Ex : Awa Koné" required>

        <label for="tel">Téléphone</label>
        <input type="tel" id="tel" placeholder="Ex : 07 00 00 00 00" required>

        <label>Type de ticket</label>
        <div class="type-options">
          <label class="type-option selected" id="opt-emg">
            <input type="radio" name="ticketType" value="emg" checked>
            <div class="t-name">Ticket EMG</div>
            <div class="t-price">12 000 F</div>
          </label>
          <label class="type-option" id="opt-hors">
            <input type="radio" name="ticketType" value="hors">
            <div class="t-name">Ticket Hors EMG</div>
            <div class="t-price">15 000 F</div>
          </label>
        </div>

        <div class="err" id="formErr"></div>
        <button type="submit">Générer mon ticket</button>
      </form>

      <div class="rail-card">
        <h3>Inscriptions de la session (<span id="railCount">0</span>)</h3>
        <table>
          <thead><tr><th>N° Ticket</th><th>Nom</th><th>Type</th></tr></thead>
          <tbody id="regTableBody">
            <tr><td colspan="3" style="color:rgba(251,245,232,0.35);">Aucune inscription pour le moment.</td></tr>
          </tbody>
        </table>
      </div>
    </div>

    <div class="card ticket-panel">
      <div id="emptyState">Votre ticket apparaîtra ici après inscription.</div>
      <canvas id="ticketCanvas" style="display:none;"></canvas>
      <div class="actions" id="ticketActions" style="display:none;">
        <button class="btn-dl" id="btnDownload">⬇ Télécharger le PDF</button>
        <button class="btn-whatsapp" id="btnWhatsapp">📤 Partager via WhatsApp</button>
      </div>
      <div class="status" id="ticketStatus"></div>
    </div>
  </div>
</div>

<div id="qr-render" style="display:none;"></div>

const bgImgEmg = new Image();
bgImgEmg.src = TICKET_BG_EMG;
const bgImgHors = new Image();
bgImgHors.src = TICKET_BG_HORS;

const registrations = [];

// Toggle visuel des cartes de type de ticket
document.querySelectorAll('.type-option').forEach(opt => {
  opt.addEventListener('click', () => {
    document.querySelectorAll('.type-option').forEach(o => o.classList.remove('selected'));
    opt.classList.add('selected');
    opt.querySelector('input').checked = true;
  });
});

async function requestTicket(nom, tel, type){
  const res = await fetch('/.netlify/functions/create-ticket', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ nom, tel, type })
  });
  if(!res.ok){
    const errData = await res.json().catch(() => ({}));
    throw new Error(errData.error || "Le serveur a refusé la création du ticket.");
  }
  return res.json(); // { ticketId, ticketNo, signature, type, priceLabel }
}

function renderTable(){
  const body = document.getElementById('regTableBody');
  document.getElementById('railCount').textContent = registrations.length;
  if(registrations.length === 0){
    body.innerHTML = '<tr><td colspan="3" style="color:rgba(251,245,232,0.35);">Aucune inscription pour le moment.</td></tr>';
    return;
  }
  body.innerHTML = registrations.map(r => `
    <tr>
      <td class="num">${r.ticketNo}</td>
      <td>${r.nom}</td>
      <td><span class="type-tag ${r.type === 'emg' ? 'emg' : 'hors'}">${r.type === 'emg' ? 'EMG' : 'Hors EMG'}</span></td>
    </tr>
  `).join('');
}

// --- Coordonnées calibrées sur le visuel (image source 1800×582 px) ---
const LEFT_BOX = { x: 75, y: 85, w: 94, h: 412 };     // zone blanche verticale : n° de ticket
const NAME_LINE = { x0: 1411, x1: 1668, y: 127 };      // ligne pointillée "Mr/Mm ...."
const QR_BOX = { x: 1549, y: 180, w: 228, h: 222 };    // cadre QR

function drawTicket(reg){
  return new Promise((resolve) => {
    const canvas = document.getElementById('ticketCanvas');
    const bg = reg.type === 'emg' ? bgImgEmg : bgImgHors;
    const w = bg.naturalWidth || 1800;
    const h = bg.naturalHeight || 582;
    canvas.width = w;
    canvas.height = h;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(bg, 0, 0, w, h);

    // --- N° de ticket, en vertical dans la boîte blanche à gauche ---
    ctx.save();
    ctx.translate(LEFT_BOX.x + LEFT_BOX.w/2, LEFT_BOX.y + LEFT_BOX.h/2);
    ctx.rotate(-Math.PI/2);
    ctx.fillStyle = "#14140f";
    ctx.font = "800 26px 'Poppins', sans-serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(reg.ticketNo, 0, 0);
    ctx.restore();

    // --- Nom, sur la ligne pointillée (contour + remplissage pour rester lisible
    // quel que soit le fond, sans avoir besoin d'un bandeau derrière) ---
    const nameCenterX = (NAME_LINE.x0 + NAME_LINE.x1) / 2;
    const nameMaxWidth = (NAME_LINE.x1 - NAME_LINE.x0);
    let nameFontSize = 22;
    ctx.textAlign = "center";
    ctx.textBaseline = "alphabetic";
    ctx.font = `700 ${nameFontSize}px 'Poppins', sans-serif`;
    while (ctx.measureText(reg.nom).width > nameMaxWidth && nameFontSize > 12) {
      nameFontSize -= 1;
      ctx.font = `700 ${nameFontSize}px 'Poppins', sans-serif`;
    }
    ctx.lineJoin = "round";
    ctx.miterLimit = 2;
    ctx.lineWidth = 5;
    ctx.strokeStyle = "rgba(20,14,10,0.85)";
    ctx.strokeText(reg.nom, nameCenterX, NAME_LINE.y - 4);
    ctx.fillStyle = "#fbf5e8";
    ctx.fillText(reg.nom, nameCenterX, NAME_LINE.y - 4);

    // --- QR signé, dans le cadre prévu ---
    const qrHolder = document.getElementById('qr-render');
    qrHolder.innerHTML = '';
    const qrSize = Math.min(QR_BOX.w, QR_BOX.h);
    new QRCode(qrHolder, {
      text: "PAIYA-GLOIRE-4|" + reg.ticketId + "|" + reg.signature,
      width: qrSize * 3, // génération haute résolution puis downscale pour un rendu net
      height: qrSize * 3,
      correctLevel: QRCode.CorrectLevel.H
    });
    setTimeout(() => {
      const qrCanvas = qrHolder.querySelector('canvas');
      if(qrCanvas){
        const qx = QR_BOX.x + (QR_BOX.w - qrSize)/2;
        const qy = QR_BOX.y + (QR_BOX.h - qrSize)/2;
        ctx.fillStyle = "#fbf5e8";
        ctx.fillRect(qx-4, qy-4, qrSize+8, qrSize+8);
        ctx.drawImage(qrCanvas, qx, qy, qrSize, qrSize);
      }
      canvas.style.display = 'block';
      document.getElementById('emptyState').style.display = 'none';
      document.getElementById('ticketActions').style.display = 'flex';
      resolve(canvas);
    }, 60);
  });
}

document.getElementById('regForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const nom = document.getElementById('nom').value.trim();
  const tel = document.getElementById('tel').value.trim();
  const type = document.querySelector('input[name="ticketType"]:checked').value;
  const errBox = document.getElementById('formErr');
  const submitBtn = e.target.querySelector('button[type="submit"]');
  errBox.textContent = '';

  if(!nom || !tel){
    errBox.textContent = "Merci de renseigner les deux champs.";
    return;
  }

  submitBtn.disabled = true;
  submitBtn.textContent = "Génération en cours…";

  try{
    const { ticketId, ticketNo, signature } = await requestTicket(nom, tel, type);
    const reg = { ticketId, ticketNo, signature, nom, tel, type };
    registrations.push(reg);
    renderTable();

    document.getElementById('ticketStatus').textContent = '';
    document.getElementById('ticketStatus').className = 'status';
    await drawTicket(reg);

    window._currentReg = reg;
    document.getElementById('regForm').reset();
    document.querySelectorAll('.type-option').forEach(o => o.classList.remove('selected'));
    document.getElementById('opt-emg').classList.add('selected');
  }catch(err){
    errBox.textContent = err.message || "Erreur, réessayez.";
  }finally{
    submitBtn.disabled = false;
    submitBtn.textContent = "Générer mon ticket";
  }
});

document.getElementById('btnDownload').addEventListener('click', () => {
  const canvas = document.getElementById('ticketCanvas');
  const { jsPDF } = window.jspdf;
  const imgData = canvas.toDataURL('image/png', 1.0);
  const pdf = new jsPDF({
    orientation: canvas.width > canvas.height ? 'landscape' : 'portrait',
    unit: 'px',
    format: [canvas.width, canvas.height]
  });
  pdf.addImage(imgData, 'PNG', 0, 0, canvas.width, canvas.height);
  const reg = window._currentReg;
  pdf.save(`Ticket-${reg ? reg.ticketNo : 'PaiyaGloire4'}.pdf`);
});

document.getElementById('btnWhatsapp').addEventListener('click', async () => {
  const reg = window._currentReg;
  const statusEl = document.getElementById('ticketStatus');
  if(!reg) return;

  const canvas = document.getElementById('ticketCanvas');
  canvas.toBlob(async (blob) => {
    if(!blob){
      statusEl.textContent = "Impossible de préparer l'image du ticket.";
      statusEl.className = 'status';
      return;
    }
    const file = new File([blob], `Ticket-${reg.ticketNo}.png`, { type: 'image/png' });
    const shareData = {
      files: [file],
      title: `Ticket Paiya de la Gloire 4 — ${reg.ticketNo}`,
      text: `Voici mon ticket pour Paiya de la Gloire 4 (${reg.ticketNo}).`
    };

    if(navigator.canShare && navigator.canShare(shareData)){
      try{
        await navigator.share(shareData);
        statusEl.textContent = "Partagé.";
        statusEl.className = 'status ok';
      }catch(err){
        if(err.name !== 'AbortError'){
          statusEl.textContent = "Le partage a échoué, essayez le téléchargement.";
          statusEl.className = 'status';
        }
      }
    } else {
      statusEl.textContent = "Le partage direct n'est pas disponible sur ce navigateur — téléchargez le PDF puis partagez-le manuellement sur WhatsApp.";
      statusEl.className = 'status';
    }
  }, 'image/png', 1.0);
});
